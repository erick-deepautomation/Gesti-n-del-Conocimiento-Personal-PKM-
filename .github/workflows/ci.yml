name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Núcleo Rust + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pkm-core --features parallel
      - run: cargo clippy -p pkm-core -p pkm-wasm -- -D clippy::correctness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
        working-directory: app
      - run: npm run wasm && npm run build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-web
          path: app/dist

  desktop:
    name: Escritorio (${{ matrix.platform }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run wasm
        working-directory: app
      - run: app/node_modules/.bin/tauri build ${{ matrix.args }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-${{ matrix.platform }}
          path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.dmg
          if-no-files-found: ignore
