[workspace]
resolver = "2"
members = ["crates/pkm-core", "crates/pkm-wasm", "src-tauri"]
# src-tauri requires system WebView libraries (webkit2gtk on Linux); build it explicitly.
default-members = ["crates/pkm-core", "crates/pkm-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.pkm-wasm]
opt-level = "s"
